name: dtv-hub
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:stable}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: 'true'
      TS_BOOT_TIMEOUT: 30m
      TS_HOSTNAME: ${TS_HOSTNAME:-dtv-hub}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'false'
      TS_ACCEPT_DNS: 'false'
      TS_EXTRA_ARGS: --accept-routes
      TS_ENABLE_HEALTH_CHECK: 'true'
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    networks:
      default:
        aliases: [mirakc]
    ports:
      - '${MIRAKC_BIND_ADDRESS:-127.0.0.1}:${MIRAKC_PORT:-13001}:40772'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9002/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
  upstream-api:
    profiles: [tools]
    network_mode: service:tailscale
    build:
      context: ./mirakc
      args:
        MIRAKC_IMAGE: ${MIRAKC_IMAGE:-mirakc/mirakc:debian}
    depends_on:
      tailscale:
        condition: service_healthy
    entrypoint: [curl, --noproxy, '*', --connect-timeout, '10']
    command: [--fail, --silent, --show-error, --max-time, '20', 'http://${MIRAKURUN_HOST:-192.168.2.10}:${MIRAKURUN_PORT:-40772}/api/version']
    logging: *logging
  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:10.11}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Set MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER:?Set MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
      - ./mariadb/my.cnf:/etc/mysql/conf.d/dtv-hub.cnf:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  mirakc:
    network_mode: service:tailscale
    build:
      context: ./mirakc
      args:
        MIRAKC_IMAGE: ${MIRAKC_IMAGE:-mirakc/mirakc:debian}
    restart: unless-stopped
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      RUST_LOG: info
    volumes:
      - type: bind
        source: ./mirakc/config.generated.yml
        target: /etc/mirakc/config.yml
        read_only: true
        bind:
          create_host_path: false
      - epg-cache:/var/lib/mirakc/epg
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', 'http://localhost:40772/api/version']
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 60s
    logging: *logging
  epgstation:
    build:
      context: ./epgstation
      args:
        EPGSTATION_REF: ${EPGSTATION_REF:-v2.10.0}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_CALENDAR_INSTANCE: ${GOOGLE_CALENDAR_INSTANCE:-dtv-hub}
    depends_on:
      mariadb:
        condition: service_healthy
      mirakc:
        condition: service_healthy
    ports:
      - '${EPGSTATION_BIND_ADDRESS:-127.0.0.1}:${EPGSTATION_PORT:-13000}:8888'
    volumes:
      - type: bind
        source: ./epgstation/config/config.yml
        target: /app/config/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RECORDING_DIRECTORY:-./recorded}
        target: /recorded
        bind:
          create_host_path: false
      - thumbnails:/app/thumbnail
      - ./epgstation/secrets:/app/secrets:ro
      - epgstation-logs:/app/logs
      - streams:/app/streams
      - drop-logs:/app/drop
    logging: *logging
volumes:
  tailscale-state:
  database:
  epg-cache:
  thumbnails:
  epgstation-logs:
  streams:
  drop-logs:
